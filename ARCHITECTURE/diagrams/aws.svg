  <rect x="1155" y="1045" width="320" height="90" rx="12" class="monitor"/><text x="1315" y="1073" text-anchor="middle" class="label">Amazon SNS</text><text x="1315" y="1098" text-anchor="middle" class="small">Alarm notifications</text><text x="1315" y="1120" text-anchor="middle" class="tiny">CloudWatch → SNS</text>
  <path d="M1105 1090 H1155" class="primary"/>
  <text x="800" y="1188" text-anchor="middle" class="tiny">ARAK AWS Solution Architecture — exact CIDRs and target-design scaling values from repository documentation</text>
