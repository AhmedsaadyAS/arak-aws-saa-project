<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#2b6cb0"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#667085"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172b4d}.subtitle{font:600 20px Arial,sans-serif;fill:#475467}.section{font:700 22px Arial,sans-serif;fill:#17365d}.label{font:700 18px Arial,sans-serif;fill:#172b4d}.small{font:16px Arial,sans-serif;fill:#344054}.tiny{font:14px Arial,sans-serif;fill:#475467}
      .edge{fill:#f4f7fb;stroke:#9fb3c8;stroke-width:2}.service{fill:#fff;stroke:#4778a8;stroke-width:2}.vpc{fill:#f8fbff;stroke:#315b7d;stroke-width:3}.az{fill:#fff;stroke:#7b9bb7;stroke-width:2;stroke-dasharray:10 7}.public{fill:#eef7ea;stroke:#77a86d;stroke-width:2}.private{fill:#eef5fb;stroke:#6d9cc7;stroke-width:2}.db{fill:#f3effb;stroke:#8b78b6;stroke-width:2}.security{fill:#fff7e8;stroke:#d49b43;stroke-width:2}.monitor{fill:#f5f3fb;stroke:#8a78b5;stroke-width:2}
      .primary{stroke:#2b6cb0;stroke-width:5;fill:none;marker-end:url(#arrow)}.secondary{stroke:#667085;stroke-width:2.5;fill:none;marker-end:url(#arrowGray)}.dashed{stroke:#667085;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#fff"/>
  <rect x="35" y="25" width="1530" height="80" rx="18" fill="#eaf2f9" stroke="#9fb3c8" stroke-width="2"/>
