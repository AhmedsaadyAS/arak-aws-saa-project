  <rect x="1160" y="185" width="280" height="65" rx="12" class="service"/><text x="1300" y="213" text-anchor="middle" class="label">Application Load Balancer</text><text x="1300" y="237" text-anchor="middle" class="small">HTTPS 443 → Target :5000</text>
