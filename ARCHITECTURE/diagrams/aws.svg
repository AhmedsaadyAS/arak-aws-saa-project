  <path d="M430 695 V720" class="secondary"/><path d="M1170 695 V720" class="secondary"/><text x="800" y="708" text-anchor="middle" class="tiny">TCP 1433 • App SG → DB SG</text>
  <path d="M430 575 V550" class="dashed"/><path d="M1170 575 V550" class="dashed"/>
