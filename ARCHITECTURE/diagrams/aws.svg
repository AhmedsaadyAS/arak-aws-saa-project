  <rect x="45" y="135" width="1510" height="145" rx="18" class="edge"/><text x="70" y="165" class="section">Public Edge</text>
  <rect x="85" y="185" width="210" height="65" rx="12" class="service"/><text x="190" y="213" text-anchor="middle" class="label">Users / Internet</text><text x="190" y="237" text-anchor="middle" class="small">HTTPS</text>
  <rect x="350" y="185" width="220" height="65" rx="12" class="service"/><text x="460" y="213" text-anchor="middle" class="label">Amazon Route 53</text><text x="460" y="237" text-anchor="middle" class="small">DNS / Alias</text>
  <rect x="625" y="185" width="235" height="65" rx="12" class="service"/><text x="742" y="213" text-anchor="middle" class="label">Amazon CloudFront</text><text x="742" y="237" text-anchor="middle" class="small">CDN / Caching</text>
