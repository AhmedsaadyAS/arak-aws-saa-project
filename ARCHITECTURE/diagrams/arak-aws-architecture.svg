<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#d9eaf7"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
    <linearGradient id="public" x1="0" x2="1"><stop offset="0" stop-color="#eef7e8"/><stop offset="1" stop-color="#f7fbef"/></linearGradient>
    <linearGradient id="private" x1="0" x2="1"><stop offset="0" stop-color="#e8f3fb"/><stop offset="1" stop-color="#f4f9fd"/></linearGradient>
    <linearGradient id="db" x1="0" x2="1"><stop offset="0" stop-color="#edf1f6"/><stop offset="1" stop-color="#f9fbfd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2b6ea6"/></marker>
    <marker id="arrowSmall" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111827} .title{font-size:31px;font-weight:700}.h1{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.meta{font-size:13px;fill:#374151}.small{font-size:12px;fill:#374151}.tiny{font-size:11px;fill:#4b5563}.label{font-size:14px;font-weight:600}.panel{stroke:#193a59;stroke-width:2;fill:#fff}.boundary{stroke:#226aa2;stroke-width:2.5;fill:none}.az{stroke:#5c9cc8;stroke-width:2;stroke-dasharray:8 6;fill:#fff}.subnet{stroke:#6b7280;stroke-width:1.5;rx:14;filter:url(#shadow)}.service{stroke:#9ca3af;stroke-width:1.2;rx:12;filter:url(#shadow)}.edge{fill:#f3f0fb;stroke:#7c55b7;stroke-width:1.8}.security{fill:#fdeeee;stroke:#d45252;stroke-width:1.6}.ops{fill:#fdeff7;stroke:#cc4f9b;stroke-width:1.6}.orange{fill:#fff1e7;stroke:#ea8f2f;stroke-width:1.8}.purple{fill:#efeafd;stroke:#6951b5;stroke-width:1.8}.green{fill:#eef8e9;stroke:#72a84b;stroke-width:1.6}.blue{fill:#eaf4fb;stroke:#4e87b5;stroke-width:1.6}.dbbox{fill:#f4f7fa;stroke:#667085;stroke-width:1.6}.dash{stroke:#7a7a7a;stroke-width:1.4;stroke-dasharray:8 7;fill:none}.log{stroke:#586273;stroke-width:1.6;fill:none}.primary{stroke:#2b6ea6;stroke-width:7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="78" fill="url(#header)"/>
  <path d="M0 78 H1600" stroke="#7fa9c7" stroke-width="2"/>
  <text x="28" y="49" class="title">ARAK — Scalable Web Application on AWS</text>

  <!-- Edge layer -->
  <g transform="translate(115,102)">
    <circle cx="72" cy="42" r="27" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="42" cy="31" r="20" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="102" cy="31" r="20" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="72" y="92" text-anchor="middle" class="label">Users / Internet</text>
  </g>
  <g class="edge" transform="translate(370,93)"><rect width="92" height="82" rx="18"/><text x="46" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#6a48a7">53</text><text x="46" y="61" text-anchor="middle" class="small">Route 53</text></g>
  <text x="416" y="193" text-anchor="middle" class="small">DNS</text>
  <g class="edge" transform="translate(655,93)"><rect width="92" height="82" rx="18"/><circle cx="46" cy="41" r="23" fill="none" stroke="#6a48a7" stroke-width="3"/><path d="M46 18 V64 M22 41 H70" stroke="#6a48a7" stroke-width="3"/></g>
  <text x="701" y="193" text-anchor="middle" class="small">CloudFront</text><text x="701" y="208" text-anchor="middle" class="tiny">Content Delivery Network</text>
  <g class="security" transform="translate(945,93)"><rect width="92" height="82" rx="18"/><path d="M46 18 L70 29 V48 C70 63 59 71 46 75 C33 71 22 63 22 48 V29 Z" fill="#d84a4a" opacity="0.95"/><path d="M35 48 L43 56 L59 37" stroke="#fff" stroke-width="4" fill="none"/></g>
  <text x="991" y="193" text-anchor="middle" class="small">AWS WAF</text><text x="991" y="208" text-anchor="middle" class="tiny">Web Application Firewall</text>
  <g class="purple" transform="translate(1235,93)"><rect width="122" height="82" rx="18"/><circle cx="61" cy="28" r="13" fill="none" stroke="#5e45aa" stroke-width="3"/><path d="M61 41 V56 M38 56 H84 M48 56 V70 M61 56 V70 M74 56 V70" stroke="#5e45aa" stroke-width="3"/><rect x="34" y="70" width="28" height="8" fill="none" stroke="#5e45aa" stroke-width="3"/></g>
  <text x="1296" y="193" text-anchor="middle" class="small">Application Load Balancer</text><text x="1296" y="208" text-anchor="middle" class="tiny">Internet-facing • Port 5000</text>
  <path d="M195 142 H360" class="primary"/><path d="M470 142 H645" class="primary"/><path d="M760 142 H935" class="primary"/><path d="M1050 142 H1225" class="primary"/>
  <text x="562" y="121" text-anchor="middle" class="label">Traffic</text>

  <!-- VPC -->
  <rect x="160" y="235" width="1280" height="700" rx="22" class="panel" filter="url(#shadow)"/>
  <text x="184" y="266" class="h1">AWS Region (us-east-1)</text>
  <rect x="198" y="282" width="1204" height="630" rx="18" class="boundary"/>
  <rect x="220" y="304" width="1160" height="586" rx="18" fill="#fdfefe" stroke="#0f5b8d" stroke-width="1.8"/>
  <text x="244" y="334" class="h1">VPC: arak-vpc (10.0.0.0/16)</text>

  <!-- AZs -->
  <rect x="242" y="360" width="530" height="500" rx="18" class="az"/>
  <rect x="828" y="360" width="530" height="500" rx="18" class="az"/>
  <text x="507" y="391" text-anchor="middle" class="h1">Availability Zone 1 (us-east-1a)</text>
  <text x="1093" y="391" text-anchor="middle" class="h1">Availability Zone 2 (us-east-1b)</text>

  <!-- public subnets -->
  <rect x="266" y="408" width="482" height="92" class="subnet" fill="url(#public)"/>
  <text x="286" y="439" class="h2">Public Subnet — arak-public-1a</text><text x="286" y="460" class="meta">10.0.1.0/24</text>
  <rect x="852" y="408" width="482" height="92" class="subnet" fill="url(#public)"/>
  <text x="872" y="439" class="h2">Public Subnet — arak-public-1b</text><text x="872" y="460" class="meta">10.0.2.0/24</text>
  <rect x="625" y="422" width="120" height="54" class="orange"/><text x="685" y="445" text-anchor="middle" class="h2">NAT Gateway</text><text x="685" y="463" text-anchor="middle" class="tiny">arak-nat-a</text>

  <!-- app subnets -->
  <rect x="266" y="520" width="482" height="148" class="subnet" fill="url(#private)"/>
  <text x="286" y="549" class="h2">Private Application Subnet</text><text x="286" y="572" class="meta">arak-private-app-1a • 10.0.11.0/24</text>
  <rect x="852" y="520" width="482" height="148" class="subnet" fill="url(#private)"/>
  <text x="872" y="549" class="h2">Private Application Subnet</text><text x="872" y="572" class="meta">arak-private-app-1b • 10.0.12.0/24</text>

  <!-- ASG -->
  <rect x="452" y="540" width="230" height="110" class="orange" rx="14"/>
  <text x="567" y="563" text-anchor="middle" class="h2">Auto Scaling Group</text>
  <text x="567" y="583" text-anchor="middle" class="small">arak-app-asg</text>
  <text x="567" y="603" text-anchor="middle" class="tiny">Min 1 • Desired 1 • Max 2</text>
  <rect x="872" y="540" width="170" height="88" class="service orange"/>
  <text x="957" y="567" text-anchor="middle" class="h2">EC2 + Docker</text><text x="957" y="588" text-anchor="middle" class="small">Arak ASP.NET Core</text><text x="957" y="607" text-anchor="middle" class="tiny">Port 5000</text>
  <rect x="302" y="565" width="120" height="68" class="service orange"/><text x="362" y="592" text-anchor="middle" class="h2">EC2</text><text x="362" y="611" text-anchor="middle" class="tiny">t3.micro</text>
  <rect x="1086" y="565" width="120" height="68" class="service orange"/><text x="1146" y="592" text-anchor="middle" class="h2">EC2</text><text x="1146" y="611" text-anchor="middle" class="tiny">t3.micro</text>

  <!-- db subnets -->
  <rect x="266" y="688" width="482" height="150" class="subnet" fill="url(#db)"/>
  <text x="286" y="716" class="h2">Private Database Subnet</text><text x="286" y="739" class="meta">arak-private-db-1a • 10.0.21.0/24</text>
  <rect x="852" y="688" width="482" height="150" class="subnet" fill="url(#db)"/>
  <text x="872" y="716" class="h2">Private Database Subnet</text><text x="872" y="739" class="meta">arak-private-db-1b • 10.0.22.0/24</text>
  <rect x="610" y="720" width="400" height="92" class="dbbox" filter="url(#shadow)"/>
  <text x="810" y="748" text-anchor="middle" class="h1">Amazon RDS for SQL Server</text><text x="810" y="768" text-anchor="middle" class="small">arak-db-2</text><text x="810" y="789" text-anchor="middle" class="meta">db.t3.micro • TCP 1433 • Private • Multi-AZ</text>

  <!-- Target group / ALB path -->
  <rect x="528" y="278" width="500" height="64" class="blue" rx="12"/>
  <text x="548" y="302" class="h2">Target Group: arak-app-tg • HTTP :5000</text>
  <text x="548" y="324" class="small">Health check: GET /health — HTTP 200</text>
  <path d="M1296 176 V235 H780 V520" class="primary"/>
  <path d="M780 520 H690 V565" class="log" marker-end="url(#arrowSmall)"/>
  <path d="M780 520 H930 V565" class="log" marker-end="url(#arrowSmall)"/>
  <path d="M685 476 V520" class="log" marker-end="url(#arrowSmall)"/>
  <path d="M567 650 V720" class="log" marker-end="url(#arrowSmall)"/>
  <path d="M957 633 V720" class="log" marker-end="url(#arrowSmall)"/>
  <path d="M362 633 V720 H610" class="dash" marker-end="url(#arrowSmall)"/>
  <path d="M1146 633 V720 H1010" class="dash" marker-end="url(#arrowSmall)"/>

  <!-- side panels -->
  <rect x="18" y="302" width="125" height="420" class="panel" filter="url(#shadow)"/>
  <text x="80" y="330" text-anchor="middle" class="h2">Security &amp;</text><text x="80" y="350" text-anchor="middle" class="h2">Management</text>
  <rect x="38" y="372" width="85" height="68" class="security"/><text x="80" y="399" text-anchor="middle" class="h2">IAM</text><text x="80" y="418" text-anchor="middle" class="tiny">ARAK-Production-EC2-Role</text>
  <rect x="38" y="455" width="85" height="68" class="security"/><text x="80" y="482" text-anchor="middle" class="h2">Systems</text><text x="80" y="501" text-anchor="middle" class="tiny">Session Manager</text>
  <rect x="38" y="538" width="85" height="68" class="security"/><text x="80" y="565" text-anchor="middle" class="h2">Secrets</text><text x="80" y="584" text-anchor="middle" class="tiny">Secrets Manager</text>

  <rect x="1457" y="302" width="125" height="420" class="panel" filter="url(#shadow)"/>
  <text x="1519" y="330" text-anchor="middle" class="h2">Monitoring</text>
  <rect x="1477" y="372" width="85" height="85" class="ops"/><text x="1519" y="402" text-anchor="middle" class="h2">CloudWatch</text><text x="1519" y="422" text-anchor="middle" class="tiny">Metrics • Alarms</text><text x="1519" y="438" text-anchor="middle" class="tiny">Dashboards</text>
  <rect x="1477" y="472" width="85" height="85" class="ops"/><text x="1519" y="502" text-anchor="middle" class="h2">SNS</text><text x="1519" y="523" text-anchor="middle" class="tiny">Operational</text><text x="1519" y="539" text-anchor="middle" class="tiny">Notifications</text>

  <!-- external service links -->
  <path d="M143 408 H242" class="dash"/>
  <path d="M1402 430 H1457" class="dash"/>
  <path d="M143 520 H242" class="dash"/>
  <path d="M1402 520 H1457" class="dash"/>

  <!-- legend -->
  <rect x="1215" y="850" width="365" height="100" class="panel"/>
  <text x="1235" y="877" class="h2">Legend</text>
  <line x1="1235" y1="898" x2="1285" y2="898" stroke="#2b6ea6" stroke-width="6" marker-end="url(#arrow)"/><text x="1300" y="903" class="small">Primary traffic</text>
  <line x1="1235" y1="922" x2="1285" y2="922" stroke="#586273" stroke-width="2"/><text x="1300" y="927" class="small">Management / logging</text>
  <line x1="1440" y1="898" x2="1490" y2="898" class="dash"/><text x="1503" y="903" class="small">Replication / secondary path</text>
  <text x="1235" y="946" class="tiny">Actual resource names and CIDRs are shown where defined in project documentation.</text>

  <text x="800" y="982" text-anchor="middle" class="small">ARAK AWS Solution Architecture — AWS Solutions Architect Graduation Project</text>
</svg>
